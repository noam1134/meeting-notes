name: MeetingNotes
options:
  bundleIdPrefix: com.noamchuri
packages:
  MeetingNotesCore:
    path: Core
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.0
targets:
  MeetingNotes:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - App/Sources
      - path: App/Resources
        buildPhase: resources
    dependencies:
      - package: MeetingNotesCore
      - package: KeyboardShortcuts
      - package: SwiftTerm
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: MeetingNotes
        CFBundleIconFile: AppIcon
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: X74V85W2JX
  MeetingNotesTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - App/Tests
    dependencies:
      - target: MeetingNotes
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: X74V85W2JX
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MeetingNotes:
    build:
      targets:
        MeetingNotes: all
        MeetingNotesTests: [test]
    test:
      targets:
        - MeetingNotesTests
